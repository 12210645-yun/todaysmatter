<!-- ============ 藍色畫面（名字／問題／檢索） ============ -->
<sc-if value="{{showBlue}}" hint-placeholder-val="{{ false }}">
<section style="position: relative; min-height: 100vh; width: 100%; background: var(--Maincolor, #0000ff); overflow: hidden; --S: min(100vw, 177.78vh); --E: clamp(6px, 1.1vw, 20px); --MW: calc(var(--S) * .044)">
  <div aria-hidden="true" style="position: absolute; left: var(--E); top: 0; bottom: 0; width: var(--MW); overflow: hidden; z-index: 2">
    <div class="mqHomeUp" style="display: flex; flex-direction: column">
      <sc-for list="{{mqTiles}}" as="m" hint-placeholder-count="8"><img src="./assets/c0e4dbbb1749c5afadec5a734737048e.png" alt="" style="display: block; width: 100%; height: auto"></sc-for>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; right: var(--E); top: 0; bottom: 0; width: var(--MW); overflow: hidden; z-index: 2">
    <div class="mqHomeDown" style="display: flex; flex-direction: column">
      <sc-for list="{{mqTiles}}" as="m" hint-placeholder-count="8"><img src="./assets/609562ab63be5247a4f887b171096eae.png" alt="" style="display: block; width: 100%; height: auto"></sc-for>
    </div>
  </div>
  <button onClick="{{goHome}}" aria-label="金日事宜｜回到首頁" class="hot" style="position: absolute; left: calc(var(--E) + var(--MW) + clamp(10px, 1.6vw, 28px)); top: clamp(14px, 3.4vh, 40px); width: calc(var(--S) * .048); padding: 0; background: transparent; border: 0; border-radius: 6px; cursor: pointer; z-index: 6">
    <img src="./assets/c9692e8d29d71662401a92d039373991.png" alt="金日事宜 TODAY'S MATTER" style="display: block; width: 100%; height: auto">
  </button>
  <div style="position: absolute; right: calc(var(--E) + var(--MW) + clamp(10px, 1.6vw, 28px)); top: calc(clamp(14px, 3.4vh, 40px) + var(--S) * .011); width: calc(var(--S) * .18); z-index: 6">
    <img src="./assets/214b96d25e89945ca9686a105d534add.png" alt="" style="display: block; width: 100%; height: auto; visibility: hidden">
    <button onClick="{{openAbout}}" aria-label="關於" class="hot" style="position: absolute; left: 0; top: 0; width: 44.44%; height: 100%; padding: 0; background: transparent; border: 0; cursor: pointer"><img src="./assets/6e0d6ef2d77647fb6c9bc6cd1e1aae35.png" alt="" style="display: block; width: 100%; height: 100%"></button>
    <button onClick="{{openList}}" aria-label="收錄（籤詩列表）" class="hot" style="position: absolute; left: 51.85%; top: 0; width: 48.15%; height: 100%; padding: 0; background: transparent; border: 0; cursor: pointer"><img src="./assets/192e154e10d8c8d35c45a63a7836ba2d.png" alt="" style="display: block; width: 100%; height: 100%"></button>
  </div>

<div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: var(--S); aspect-ratio: 16 / 9; container-type: size; z-index: 3">

  <sc-if value="{{isName}}" hint-placeholder-val="{{ false }}">
    <div class="scr" aria-hidden="true" style="position: absolute; left: 48.295%; top: 57.103%; width: 0; height: 0; perspective: 149.87cqw; z-index: 1">
      <div style="transform-style: preserve-3d; transform: rotateZ(13.695deg) rotateX(18.63deg)">
        <div class="ring3d">
          <sc-for list="{{nameTiles}}" as="g" hint-placeholder-count="60"><span style="{{g.style}}">{{g.ch}}</span></sc-for>
          <sc-for list="{{namePink}}" as="g" hint-placeholder-count="192"><div class="{{g.cls}}" style="{{g.style}}"></div></sc-for>
        </div>
      </div>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 36.3%; top: 48.16%; width: 27.39%; height: 8.49%; border-radius: 999px; background: #fff; box-shadow: 0 0 2.4cqw .5cqw rgba(170,170,255,.95), {{nameRing2}}; z-index: 2"></div>

    <label for="nm" class="sr">輸入你的代稱</label>
    <input id="nm" class="home-in" value="{{name}}" onChange="{{onName}}" onKeyDown="{{nameKey}}" autocomplete="off" style="position: absolute; left: 38.2%; top: 49.4%; width: 20%; height: 5.6%; z-index: 4; border: 0; outline: none; padding: 0 0 0 .2cqw; background: {{nameInBg}}; color: #141414; caret-color: #141414; font-family: 'GenSen M', sans-serif; font-size: 1.75cqw; letter-spacing: .08em">

  </sc-if>

  <sc-if value="{{isQuestion}}" hint-placeholder-val="{{ false }}">

      <div style="transform-style: preserve-3d; transform: rotateZ(38.656deg) rotateX(45.901deg)">

          <sc-for list="{{askRing}}" as="g" hint-placeholder-count="192"><div class="{{g.cls}}" style="{{g.style}}"></div></sc-for>

    <input id="qs" class="home-in" value="{{q}}" onChange="{{onQ}}" onKeyDown="{{qKey}}" autocomplete="off" style="position: absolute; left: 33.9%; top: 46.2%; width: 28.8%; height: 5.6%; z-index: 4; border: 0; outline: none; padding: 0 0 0 .2cqw; background: {{qInBg}}; color: #141414; caret-color: #141414; font-family: 'GenSen M', sans-serif; font-size: 1.75cqw; letter-spacing: .08em">
